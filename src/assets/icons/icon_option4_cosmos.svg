<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="spaceBg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#141829" />
      <stop offset="50%" stop-color="#0A0C16" />
      <stop offset="100%" stop-color="#020306" />
    </radialGradient>
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#2979FF" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#spaceBg)" />

  <!-- Stars -->
  <circle cx="100" cy="120" r="2" fill="#FFF" opacity="0.6" />
  <circle cx="410" cy="90" r="3" fill="#FFF" opacity="0.8" />
  <circle cx="430" cy="380" r="2" fill="#FFF" opacity="0.5" />
  <circle cx="80" cy="400" r="2.5" fill="#FFF" opacity="0.7" />
  <circle cx="256" cy="70" r="3" fill="#FFF" opacity="0.9" />

  <!-- Glass Circle -->
  <circle cx="256" cy="256" r="180" fill="#FFFFFF" fill-opacity="0.04" stroke="url(#cyanNeon)" stroke-width="4" />
  
  <!-- Constellation A lines -->
  <line x1="256" y1="120" x2="160" y2="360" stroke="url(#cyanNeon)" stroke-width="6" />
  <line x1="256" y1="120" x2="352" y2="360" stroke="url(#cyanNeon)" stroke-width="6" />
  <line x1="195" y1="270" x2="317" y2="270" stroke="url(#cyanNeon)" stroke-width="6" />

  <!-- Constellation Star Nodes -->
  <circle cx="256" cy="120" r="10" fill="#FFF" stroke="#00E5FF" stroke-width="4" />
  <circle cx="160" cy="360" r="10" fill="#FFF" stroke="#00E5FF" stroke-width="4" />
  <circle cx="352" cy="360" r="10" fill="#FFF" stroke="#00E5FF" stroke-width="4" />
  <circle cx="195" cy="270" r="7" fill="#FFF" />
  <circle cx="317" cy="270" r="7" fill="#FFF" />
</svg>
