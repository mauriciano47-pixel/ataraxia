<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="shieldBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2C1B1B" />
      <stop offset="100%" stop-color="#080606" />
    </radialGradient>
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F39C12" />
      <stop offset="50%" stop-color="#D32F2F" />
      <stop offset="100%" stop-color="#4A0000" />
    </linearGradient>
    <linearGradient id="metalRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#888" />
      <stop offset="50%" stop-color="#333" />
      <stop offset="100%" stop-color="#111" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#shieldBg)" />

  <!-- Shield Outline -->
  <path d="M 256 64 C 360 64 416 96 416 200 C 416 320 320 400 256 448 C 192 400 96 320 96 200 C 96 96 152 64 256 64 Z" fill="#120D0D" stroke="url(#bronzeGrad)" stroke-width="12" />

  <!-- Inner Shield Glow -->
  <path d="M 256 88 C 340 88 392 114 392 200 C 392 300 308 372 256 416 C 204 372 120 300 120 200 C 120 114 172 88 256 88 Z" fill="none" stroke="#D32F2F" stroke-width="3" stroke-opacity="0.6" />

  <!-- Central 'A' Spartan Crest -->
  <path d="M 256 128 L 336 348 L 296 348 L 276 288 L 236 288 L 216 348 L 176 348 Z" fill="url(#bronzeGrad)" />
  <polygon points="256,168 270,250 242,250" fill="#0D0909" />
  
  <!-- Swords / Spartan V Cut -->
  <path d="M 196 260 L 316 260" stroke="#FFF" stroke-width="6" stroke-linecap="round" />
